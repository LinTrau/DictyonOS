# A tag is a claim that this exact tree boots.  Everything a release needs is
# built here and attached here, so publishing one is not a manual step: the
# token that creates the release is the one GitHub hands every workflow run,
# and the release notes are the tag's own annotation, which makes the tag the
# single thing to write.  Pushing a tag is the whole procedure:
#
#     git tag -a v0.2.0    # the annotation becomes the release notes
#     git push origin v0.2.0
#
# This job does not re-run the acceptance test.  A tag is cut from a commit
# that main CI already accepted, and the acceptance takes twice as long as the
# build.  The build is still a real build, so a release can never be cut from
# a tree that does not evaluate and compile.  What it does run is the bundle's
# own smoke test: the archive that is about to be attached is unpacked and
# booted once, and a machine that cannot come up or cannot shut itself down
# fails the release before anything is published.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Re-pushing a tag (to attach a fixed build, say) replaces the release in
# place; only the newest run should touch its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The annotation of the tag being released is the release body, so
          # the tag object has to be here.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build the machine
        run: nix build .#kernel .#initramfs .#rootfs .#system

      # zstd comes out of nixpkgs, so the archive does not depend on what the
      # runner image happens to ship.
      - name: Assemble the prebuilt bundle
        run: nix shell nixpkgs#zstd --command ./scripts/make-release-bundle.sh "dictyonos-$GITHUB_REF_NAME-x86_64"

      # Boot the archive itself, not the flake outputs: this is what catches a
      # packaging step that dropped a file or paired the wrong kernel with the
      # wrong rootfs, and it is the last chance to stop a broken download.
      - name: Boot the bundle before publishing
        env:
          SMOKE_ARTIFACTS: smoke-artifacts
        run: |
          nix shell nixpkgs#zstd nixpkgs#qemu nixpkgs#e2fsprogs nixpkgs#openssh \
                    nixpkgs#coreutils nixpkgs#procps \
            --command ./scripts/smoke-bundle.sh "dist/dictyonos-$GITHUB_REF_NAME-x86_64-qemu.tar.zst"

      # A smoke test that only says "it did not boot" is not much use from
      # another machine, so the console and the serial transcript get uploaded
      # whenever the step above does not pass.
      - name: Keep the smoke transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The annotation is the release body, so the tag object itself has
          # to be here: actions/checkout can leave refs/tags/<name> pointing
          # straight at the commit, and %(contents:*) on such a ref reads the
          # commit message instead of the annotation.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::refs/tags/$GITHUB_REF_NAME is not an annotated tag, and its annotation is the release body"
            exit 1
          fi
          title=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$GITHUB_REF_NAME")
          body=$(git for-each-ref --format='%(contents:body)' "refs/tags/$GITHUB_REF_NAME")
          archive="dist/dictyonos-$GITHUB_REF_NAME-x86_64-qemu.tar.zst"
          # gh release edit has no --notes-from-tag, so read the annotation
          # here and hand both commands the subject and the body.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The tag was moved, so the release already exists and holds the
            # old build: replace its notes and its assets (--clobber).
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes "$body"
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "$archive" dist/asterinas-osdk-bin.elf dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$title" --notes "$body" \
              "$archive" dist/asterinas-osdk-bin.elf dist/SHA256SUMS
          fi
