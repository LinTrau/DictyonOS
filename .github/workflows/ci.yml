# The acceptance test is the point of this project: a machine that boots a
# framekernel, comes up under s6, answers ssh and keeps its state across a
# reboot.  So CI runs exactly what the README tells a person to run -- no
# narrower "unit test" path that could pass while the image is broken.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Where the built kernel, initramfs, rootfs and configuration are cached
      # (public key: flake.nix). Pushing needs this secret; without it the two
      # cache steps below are skipped and the job builds from source as before.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Keeps a first-time or freshly bumped build from recompiling the kernel
      # and Lix on every run.
      - name: Set up the binary cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v15
        with:
          name: dictyonos
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      # QEMU should use KVM when it can: without it the machine still boots, but
      # in TCG emulation, which turns a two minute acceptance run into a very
      # slow one.  GitHub's linux runners expose /dev/kvm to root only on some
      # images, hence the udev rule; if the device is simply absent the script
      # notices and emulates instead.
      - name: Make /dev/kvm usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "no /dev/kvm on this runner; the VM will fall back to TCG"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-dictyonos-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # --no-build only evaluates the flake, which is instant; building it
      # would drag in the asterinas devShell, and the outputs the machine
      # actually needs are built explicitly in the next step anyway.
      - name: Evaluate every flake output
        run: nix flake check --all-systems --no-build

      - name: Build the kernel, the initramfs, the rootfs and the configuration
        run: nix build .#kernel .#initramfs .#rootfs .#system

      # The kernel goes first and on its own: it is one self-contained path, so if
      # the cache or the token is wrong the job says so in seconds instead of
      # walking a gigabyte-long rootfs closure first. The rootfs closure is about
      # a gigabyte the first time and cheap afterwards.
      #
      # None of this may fail the job: a cache outage is not a reason to stop
      # testing whether the machine boots, so a failed push is a warning.
      - name: Push the build to the binary cache
        if: env.CACHIX_AUTH_TOKEN != ''
        continue-on-error: true
        run: |
          # The reason has to be readable by someone without write access to the
          # repository, and a step's stdout is not -- annotations are, so a failed
          # push repeats the first lines of what cachix said (its message is at the
          # top; the stack trace at the bottom was all the first attempt showed).
          push() {
            local out line
            if out=$("$@" 2>&1); then
              return 0
            fi
            printf '%s\n' "$out" | head -n 6 | while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::warning title=cachix push failed::$line"
            done
            return 1
          }
          # Separates "the token cannot see this cache" from "the push mechanism
          # failed": this is a plain authenticated read of the cache's metadata.
          # The body carries "permission", which is where a read-only token shows
          # itself: it says Read, while a token that may push says Write.
          code=$(curl -sS -o /tmp/cachix-cache.json -w '%{http_code}' \
                   -H "Authorization: Bearer $CACHIX_AUTH_TOKEN" \
                   https://cachix.org/api/v1/cache/dictyonos || true)
          perm=$(python3 -c 'import json; print(json.load(open("/tmp/cachix-cache.json"))["permission"])' 2>/dev/null || true)
          echo "::notice title=cachix token check::GET api/v1/cache/dictyonos -> HTTP $code, permission=${perm:-unknown}"
          # Cachix answers Read, Write or Admin for a token that is allowed to touch
          # the cache; only the first cannot push.
          case "${perm:-}" in
          Write|Admin) ;;
          *)
            echo "::warning title=cachix token is read-only::permission=${perm:-unknown}: the token may read dictyonos but not push. Create a write token in Cachix (Account -> Authentication tokens) and replace the secret."
            exit 0 ;;
          esac
          push cachix push dictyonos $(nix build .#kernel --no-link --print-out-paths) || {
            echo "::warning::the kernel did not reach the cache, so the rest is skipped; the acceptance below still runs"
            exit 0
          }
          push cachix push dictyonos $(nix build .#initramfs .#rootfs .#system --no-link --print-out-paths) || true
          echo "::notice::pushed the build to https://dictyonos.cachix.org"

      # Boots twice against the same state disk: the first boot runs the
      # checks, switches to a second generation and writes /var/persist-early
      # and /var/persist-late; the second boot has to start that generation,
      # find both files again and present the same dropbear host key. 6G for the
      # guest, because the runner has 16G and the Nix daemon lives there too.
      # The generous waits cost nothing on KVM and cover the TCG fallback, where
      # every guest step takes several times as long.
      - name: Run the acceptance (boot, ssh, reboot, persistence, new generation)
        run: AUTO=1 MEM=6G TIMEOUT=900 STEP_WAIT=300 HALT_WAIT=900 nix run

      # The state disk still has nextboot = the generation boot 2 started and
      # prevboot = the one the image came with, so one more boot with
      # dictyonos.rollback=1 has to come up on prevboot. That is the rollback
      # half of "change a generation and be able to change back".
      - name: Roll back to the previous generation on the same state disk
        run: |
          AUTO=1 ROLLBACK=1 MEM=6G TIMEOUT=900 STEP_WAIT=300 HALT_WAIT=900 \
            SERIAL_LOG=serial-rollback.log SERIAL_LOG_HOST=serial-rollback.host.log nix run

      - name: Upload the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: |
            serial.log
            serial-boot2.log
            serial.host.log
            serial-rollback.log
            serial-rollback.host.log
            .dictyonos-vm/id_ed25519.pub
          if-no-files-found: warn
